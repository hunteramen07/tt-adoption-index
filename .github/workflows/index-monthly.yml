name: Monthly Index Reading

# Computes last month's RTA Index reading (per-product month-end snapshots + the
# composite) and writes it to Supabase. This was a manual first-of-month task and
# lapsed silently after 2026-05-31 — June–August 2026 were missing until 2026-09-22.
#
# `npm run backfill -- --refresh` first pulls every active fund's Ethereum transfer
# history through the Etherscan cache (CI has no persisted cache, and the nightly no
# longer populates it for the rwa.xyz multi-chain funds), then recomputes EVERY
# complete month-end and upserts it — the readings are idempotent, and re-running
# under the current NAVs is by design (see src/lib/index/backfill.ts).
#
# AUM comes from the PERSISTED Dune series in Supabase aum_history (written by the
# 06:30 refresh-dune run) — this job never reads Dune live and needs no DUNE_API_KEY.
# If the persisted execution does not cover the month-end (refresh-dune failed, as it
# did every night from 2026-09-24 on Dune's datapoint quota), the backfill THROWS
# instead of forward-filling a stale value into the reading.
#
# Runs on the 1st at 07:30 UTC, after the 07:00 nightly, in the SAME concurrency
# group so it never overlaps a classify/backfill/re-anchor run.

on:
  schedule:
    - cron: '30 7 1 * *'
  workflow_dispatch:

concurrency:
  group: classify
  cancel-in-progress: false

jobs:
  index-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh transfer histories and write the monthly index reading
        run: npm run backfill -- --refresh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
