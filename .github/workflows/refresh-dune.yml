name: Nightly Dune Refresh

# Executes the supply/AUM Dune query (7696914) and persists only the RECENT rows
# (latest persisted day − 7, re-read for late corrections) into Supabase
# `aum_history` via scripts/refresh-dune.ts. The homepage and the monthly index
# reading read aum_history ONLY — never live Dune — so Dune's per-cycle datapoint
# quota is spent once a night on ~120 datapoints instead of on every page view.
# (The live reads exhausted the quota on 2026-09-24: 26 straight failures here,
# the AUM chart dark, and the 2026-10-01 monthly reading never written.)
#
# First run after the table is created needs `full: true` (one-time load of the
# whole result set, ~12,200 datapoints). The script refuses an incremental run
# against an empty table, and stops on any Dune error without writing.
#
# Independent of the classify pipeline (market data vs. behavioral data).
# Runs at 06:30 UTC, an hour before the 07:30 monthly reading on the 1st, so the
# month-end's execution is persisted before the backfill reads it.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'One-time FULL load of the whole result set (~12,200 datapoints)'
        type: boolean
        default: false

concurrency:
  group: refresh-dune
  cancel-in-progress: false

jobs:
  refresh-dune:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute the Dune query and persist recent rows into aum_history
        run: npm run refresh-dune -- ${{ inputs.full == true && '--full' || '' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
